name: AI Service CI / CD (FastAPI + Whisper)

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feat/azure-integration
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ============================================================================
  # Job 1: Quality Gate & Testes Automatizados (FastAPI / Chatbot Context)
  # ============================================================================
  validate:
    name: Quality Gate & Testes (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes automatizados do Chatbot (Checklist Completa)
        run: |
          python test_chatbot_context.py

  # ============================================================================
  # Job 2: Build & Push de Imagem Docker (Docker Hub com Cache GHA)
  # ============================================================================
  build-and-push:
    name: Build & Push Imagem Docker
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/azure-integration' || github.event_name == 'workflow_dispatch'

    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      should_deploy: ${{ steps.version.outputs.should_deploy }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js para Versionamento Semântico
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Semver
        run: npm install -g semver

      - name: Criar tag v0.0.0 inicial caso não exista
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git tag)" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a v0.0.0 -m "Initial release"
            git push origin v0.0.0
          else
            echo "Tag v0.0.0 já existe - nenhuma ação necessária."
          fi

      - name: Calcular nova versão semântica e Tag Docker
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune
          EXISTING_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "${EXISTING_TAG:-}" ]; then
            echo "Reexecução detectada: usando tag existente $EXISTING_TAG"
            VERSION="${EXISTING_TAG#v}"
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            BRANCH_NAME="${GITHUB_REF_NAME:-branch}"
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-15)
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              DOCKER_TAG="$VERSION"
              DOCKER_TAGS="${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:latest,${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:${VERSION}"
            else
              DOCKER_TAG="${VERSION}-${SAFE_BRANCH}.${SHORT_SHA}"
              DOCKER_TAGS="${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:${DOCKER_TAG}"
            fi
            {
              echo "should_deploy=false"
              echo "current_version=$VERSION"
              echo "new_version=$VERSION"
              echo "docker_tag=$DOCKER_TAG"
              echo "docker_tags=$DOCKER_TAGS"
            } >> "$GITHUB_OUTPUT"
            echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Nenhuma tag semântica no HEAD. Calculando nova versão..."
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "${LAST_TAG:-}" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Última tag: $LAST_TAG"
          CURRENT_VERSION="${LAST_TAG#v}"
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            LOG_RANGE=""
          else
            LOG_RANGE="${LAST_TAG}..HEAD"
          fi

          mapfile -t COMMITS < <(git log ${LOG_RANGE} --pretty=format:'%s' || true)
          echo "Commits desde ${LAST_TAG}:"
          printf ' - %s\n' "${COMMITS[@]:-<nenhum>}"

          MAJOR=0; MINOR=0; PATCH=0
          for COMMIT in "${COMMITS[@]:-}"; do
            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT" =~ ^feat!\: ]] || [[ "$COMMIT" =~ \!$ ]]; then
              MAJOR=1
            elif [[ "$COMMIT" =~ ^feat(\(.+\))?\: ]]; then
              MINOR=1
            elif [[ "$COMMIT" =~ ^fix(\(.+\))?\: ]]; then
              PATCH=1
            fi
          done

          NEW_VERSION="$CURRENT_VERSION"
          if [[ $MAJOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i major "$CURRENT_VERSION")
          elif [[ $MINOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i minor "$CURRENT_VERSION")
          elif [[ $PATCH -eq 1 ]]; then
            NEW_VERSION=$(semver -i patch "$CURRENT_VERSION")
          elif [ "$LAST_TAG" = "v0.0.0" ] && [ "$CURRENT_VERSION" = "0.0.0" ]; then
            NEW_VERSION="1.0.0"
          fi

          # Tag da imagem Docker:
          # - main: usa SemVer limpo (ex: 1.0.1) e :latest
          # - outras branches: usa pré-release com branch e commit SHA (ex: 1.0.1-feat-azure.7ce7ea4)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME="${GITHUB_REF_NAME:-branch}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-15)

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DOCKER_TAG="$NEW_VERSION"
            DOCKER_TAGS="${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:latest,${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:${NEW_VERSION}"
          else
            DOCKER_TAG="${NEW_VERSION}-${SAFE_BRANCH}.${SHORT_SHA}"
            DOCKER_TAGS="${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:${DOCKER_TAG}"
          fi

          echo "Versões (atual / nova / docker_tag): $CURRENT_VERSION -> $NEW_VERSION ($DOCKER_TAG)"
          {
            echo "should_deploy=true"
            echo "current_version=$CURRENT_VERSION"
            echo "new_version=$NEW_VERSION"
            echo "docker_tag=$DOCKER_TAG"
            echo "docker_tags=$DOCKER_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"

      - name: Atualizar versão no package.json
        if: steps.version.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          CURRENT_PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_PKG_VERSION" != "${NEW_VERSION}" ]; then
            npm version "${NEW_VERSION}" --no-git-tag-version
          else
            echo "Versão $NEW_VERSION já está no package.json"
          fi

      - name: Commit e push do package.json e tag (apenas main)
        if: steps.version.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): version ${NEW_VERSION}" || echo "Nada para commitar"
          if ! git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            git tag "v${NEW_VERSION}"
          fi
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker (Cache GHA Otimizado)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.version.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 3: Continuous Deployment & Smoke Test (Azure Container Apps Chatbot)
  # ============================================================================
  deploy-azure:
    name: Continuous Deployment (Azure ACA Chatbot)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/azure-integration' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://ca-biodash-ai-prod.victoriousmoss-60cc301a.chilecentral.azurecontainerapps.io
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      RG_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME || 'rg-biodash-prod' }}
      CONTAINER_APP_NAME: 'ca-biodash-ai-prod'
      IMAGE_TAG: ${{ needs.build-and-push.outputs.docker_tag || needs.build-and-push.outputs.new_version || 'latest' }}
    steps:
      - name: Azure Login via OIDC (Zero Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps (Atualização do Chatbot)
        run: |
          IMAGE_NAME="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biodash_ai-service:${IMAGE_TAG}"
          echo "Atualizando Container App '$CONTAINER_APP_NAME' para a imagem versionada '$IMAGE_NAME'..."
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RG_NAME" \
            --image "$IMAGE_NAME"
          echo "✅ Container App atualizado com sucesso no Azure Container Apps!"

      - name: Smoke Test Pós-Deploy (Disponibilidade Health Ativa)
        id: smoke_test
        run: |
          AI_FQDN=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RG_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
          AI_URL="https://${AI_FQDN}/health"
          echo "ai_url=$AI_URL" >> "$GITHUB_OUTPUT"
          echo "Executando Smoke Test no Chatbot AI Service: $AI_URL..."

          MAX_RETRIES=10
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$AI_URL" || echo "000")
            echo "Tentativa $((RETRY_COUNT + 1))/$MAX_RETRIES - Código HTTP retornado: $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              SUCCESS=true
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 10
          done

          if [ "$SUCCESS" = true ]; then
            echo "✅ Smoke test passou com louvor! O Chatbot AI Service está respondendo 200 OK."
          else
            echo "❌ Smoke test falhou! O Chatbot AI Service não respondeu HTTP 200 em tempo hábil."
            exit 1
          fi

      - name: Publicar Resumo do Deploy (Step Summary)
        if: always()
        run: |
          AI_URL="${{ steps.smoke_test.outputs.ai_url || 'https://ca-biodash-ai-prod.victoriousmoss-60cc301a.chilecentral.azurecontainerapps.io/health' }}"
          echo "### 🚀 Deploy Azure Container Apps (Chatbot AI Service)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container App** | \`$CONTAINER_APP_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem Docker** | \`docker.io/mathgueff/biodash_ai-service:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão / Tag** | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente** | \`production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Endpoint** | [$AI_URL]($AI_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status Smoke Test** | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY