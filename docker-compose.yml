services:
  biodash-ai:
    build:
      context: .
    image: mathgueff/biodash_ai-service:latest
    container_name: biodash_ai-service
    environment:
      AI_SERVICE_PORT: "5000"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - whisper-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper-cache:
